# A companion Flutter Web app hosted on Render's static CDN.
# Flutter Android devices connect directly to Firebase; Render does not host Firestore.
services:
  - type: web
    name: aquacampus-web
    runtime: static
    repo: https://github.com/SHWETHA-1315/AQUACAMPUS
    branch: main
    buildCommand: bash scripts/build_render_web.sh
    staticPublishPath: build/web
    envVars:
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
