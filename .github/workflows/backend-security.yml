name: Verify AQUACAMPUS Firebase Backend Rules
on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'backend-tests/**'
      - 'tools/bootstrap_admin.py'
      - 'BOOTSTRAP_ADMIN.ps1'
      - 'START_AQUACAMPUS_FIREBASE.ps1'
      - '.github/workflows/firebase-cloud-deploy.yml'
      - '.github/workflows/backend-security.yml'
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate backend bootstrap Python syntax
        run: python3 -m py_compile tools/bootstrap_admin.py
      - name: Validate Windows backend scripts syntax
        shell: pwsh
        run: |
          $items = @('START_AQUACAMPUS_FIREBASE.ps1', 'BOOTSTRAP_ADMIN.ps1', 'build_apk.ps1')
          foreach ($file in $items) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "Invalid PowerShell syntax in $file"
            }
          }
      - name: Install Firebase emulator and testing SDK
        run: npm install --no-audit --no-fund
      - name: Run Firestore role/security tests against emulator
        run: npm run test:emulator

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase progress handling in Windows PowerShell 5.1
        shell: powershell
        run: .\backend-tests\firebase-cli-windows.test.ps1
