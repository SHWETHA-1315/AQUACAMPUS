name: Deploy AQUACAMPUS Firebase Cloud Backend

# Runs only with explicit owner authorization and federated Google Cloud IAM.
# This does NOT deploy a website, fake data, or an unauthenticated demo.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Type aquacampus-ed284 to confirm production deployment'
        type: string
        required: true
      approve_two_admins:
        description: 'To activate both admins using environment secrets, type ACTIVATE TWO ADMINS'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: aquacampus-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'SHWETHA-1315/AQUACAMPUS' && inputs.project == 'aquacampus-ed284'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-production
    steps:
      - name: Fetch verified backend rules
        uses: actions/checkout@v4

      - name: Confirm cloud target and credentials configuration
        env:
          WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ -n "$WIF_PROVIDER" && -n "$DEPLOY_SA" ]] || {
            echo "::error::Google Cloud owner must authorize GitHub first. Configure FIREBASE_WIF_PROVIDER and FIREBASE_DEPLOY_SERVICE_ACCOUNT as GitHub environment variables for firebase-production."
            exit 1
          }
          [[ "$WIF_PROVIDER" == projects/912969196848/locations/global/workloadIdentityPools/* ]] || {
            echo "::error::Wrong Google Cloud project in WIF provider."
            exit 1
          }

      - name: Set up Node for emulator and deployment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install backend testing and Firebase CLI dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Firestore security rules before cloud deployment
        run: npm run test:emulator

      - name: Authenticate GitHub to project-owner Google Cloud identity
        uses: google-github-actions/auth@v3
        with:
          project_id: aquacampus-ed284
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Email/Password Authentication and Firestore rules
        env:
          GOOGLE_CLOUD_PROJECT: aquacampus-ed284
        run: |
          set -euo pipefail
          npx firebase-tools deploy --project aquacampus-ed284 --only auth,firestore:rules --non-interactive
          echo "Cloud deploy finished. Verify project Auth and deployed rule version in Firebase Console."

      - name: Activate TWO verified Admin accounts (optional, all-or-nothing)
        if: inputs.approve_two_admins != ''
        env:
          ADMIN_ONE: ${{ secrets.AQUACAMPUS_ADMIN_ONE_EMAIL }}
          ADMIN_TWO: ${{ secrets.AQUACAMPUS_ADMIN_TWO_EMAIL }}
          EXPLICIT_APPROVAL: ${{ inputs.approve_two_admins }}
        run: |
          set -euo pipefail
          [[ "$EXPLICIT_APPROVAL" == 'ACTIVATE TWO ADMINS' ]] || {
            echo "::error::Owner confirmation is incorrect."
            exit 1
          }
          [[ -n "$ADMIN_ONE" && -n "$ADMIN_TWO" && "$ADMIN_ONE" != "$ADMIN_TWO" ]] || {
            echo "::error::Configure two DIFFERENT registered Admin emails as firebase-production environment secrets."
            exit 1
          }
          python3 -m pip install --quiet firebase-admin google-cloud-firestore
          python3 tools/activate_two_admins.py \
            --email-one "$ADMIN_ONE" --email-two "$ADMIN_TWO" \
            --confirm-one "$ADMIN_ONE" --confirm-two "$ADMIN_TWO"
          echo "Two verified full-control Admins activated in Firebase." >> "$GITHUB_STEP_SUMMARY"

      - name: Audit deployed rules and both live Admin accounts
        if: inputs.approve_two_admins != ''
        env:
          ADMIN_ONE: ${{ secrets.AQUACAMPUS_ADMIN_ONE_EMAIL }}
          ADMIN_TWO: ${{ secrets.AQUACAMPUS_ADMIN_TWO_EMAIL }}
        run: |
          python3 tools/check_production_ready.py \
            --admin-one "$ADMIN_ONE" --admin-two "$ADMIN_TWO"
          echo "Read-only server audit passed for both active Admin identities and the current Firestore rules." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark verified cloud deployment
        run: |
          echo "Firebase Auth + Firestore rules deployed to aquacampus-ed284" >> "$GITHUB_STEP_SUMMARY"
          echo "Emulator security tests passed before deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud rules deployed. Two-admin activation is performed only when both verified accounts and matching confirmations are supplied." >> "$GITHUB_STEP_SUMMARY"
          echo "Two-phone realtime testing remains a separate acceptance check." >> "$GITHUB_STEP_SUMMARY"
