name: Build AQUACAMPUS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: aquacampus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout Flutter app source
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name aquacampus --platforms android .
          fi
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Compile registered Firebase-connected Android APK
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/firebase_android_config.dart || { echo "Firebase Android client config missing"; exit 1; }
          grep -q "aquacampus-ed284" lib/firebase_android_config.dart || { echo "Wrong Firebase project"; exit 1; }
          for attempt in 1 2 3; do
            echo "Android release compilation attempt $attempt of 3"
            if flutter build apk --release --target-platform android-arm64 --split-per-abi; then
              exit 0
            fi
            # Sometimes Android SDK's NDK download ends as a partial/corrupt ZIP.
            # On subsequent tries, clear only the incomplete NDK directory.
            ndk_dir="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk/28.2.13676358"
            if [[ -d "$ndk_dir" && ! -f "$ndk_dir/source.properties" ]]; then
              echo "Cleaning incomplete SDK NDK installation before retry"
              rm -rf "$ndk_dir"
            fi
            sleep 8
          done
          echo "Release APK compilation failed after three attempts."
          exit 1
      - name: Save APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AQUACAMPUS-Android-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-${{ github.run_number }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AQUACAMPUS.apk
          sha256sum AQUACAMPUS.apk > AQUACAMPUS.apk.sha256
          gh release create "$RELEASE_TAG" AQUACAMPUS.apk AQUACAMPUS.apk.sha256 \
            --target "$GITHUB_SHA" --title "AQUACAMPUS Android" \
            --notes "Android ARM64 APK. Firebase project: aquacampus-ed284." --latest
