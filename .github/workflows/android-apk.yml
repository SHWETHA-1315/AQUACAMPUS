name: Build AQUACAMPUS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout Flutter app source
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name aquacampus --platforms android .
          fi
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Compile installable release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        shell: bash
        run: |
          if [[ -n "$FIREBASE_API_KEY" && -n "$FIREBASE_APP_ID" && -n "$FIREBASE_MESSAGING_SENDER_ID" && -n "$FIREBASE_PROJECT_ID" ]]; then
            echo 'All four Firebase public config values supplied; building live-enabled APK.'
            flutter build apk --release \
              "--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY" \
              "--dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID" \
              "--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
              "--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
              "--dart-define=FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"
          else
            echo 'Firebase Android configuration is required; no unconfigured APK is published.'
            exit 1
          fi
      - name: Save APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AQUACAMPUS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
