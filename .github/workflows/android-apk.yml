name: Build AQUACAMPUS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout Flutter app source
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name aquacampus --platforms android .
          fi
      - name: Fetch dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Compile registered Firebase-connected Android APK
        run: |
          test -f lib/firebase_android_config.dart || { echo "Firebase Android client config missing"; exit 1; }
          grep -q "aquacampus-ed284" lib/firebase_android_config.dart || { echo "Wrong Firebase project"; exit 1; }
          flutter build apk --release
      - name: Save APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AQUACAMPUS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
